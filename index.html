<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="A directory of web applications and HTML projects."
    >

    <title>John's GitHub Resources</title>

    <style>
        :root {
            --primary: #17365d;
            --primary-light: #eaf1f8;
            --accent: #2f6fa5;
            --text: #243142;
            --muted: #5f6b78;
            --background: #f4f7fa;
            --surface: #ffffff;
            --border: #d9e1e8;
            --focus: #ffbf47;
            --error-background: #fff3f3;
            --error-border: #b42318;
            --warning-background: #fff8e6;
            --warning-border: #b7791f;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: var(--background);
            color: var(--text);
            font-family: Lato, Arial, sans-serif;
            line-height: 1.6;
        }

        header {
            padding: 3.5rem 1.5rem;
            background: var(--primary);
            color: white;
            text-align: center;
        }

        header h1 {
            margin: 0 0 0.75rem;
            font-size: clamp(2rem, 5vw, 3.25rem);
            line-height: 1.15;
        }

        header p {
            max-width: 700px;
            margin: 0 auto;
            font-size: 1.05rem;
            opacity: 0.92;
        }

        main {
            width: min(1100px, calc(100% - 2rem));
            margin: -1.5rem auto 3rem;
        }

        .directory-panel {
            padding: clamp(1.25rem, 4vw, 2rem);
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 18px;
            box-shadow: 0 12px 35px rgba(20, 40, 60, 0.1);
        }

        .directory-heading {
            margin: 0 0 0.25rem;
            color: var(--primary);
            font-size: 1.5rem;
        }

        .directory-description {
            margin: 0 0 1.5rem;
            color: var(--muted);
        }

        #page-list {
            display: grid;
            grid-template-columns:
                repeat(auto-fit, minmax(240px, 1fr));
            gap: 1rem;
            margin: 0;
            padding: 0;
            list-style: none;
        }

        .page-card {
            height: 100%;
        }

        .page-link {
            display: flex;
            flex-direction: column;
            height: 100%;
            min-height: 180px;
            padding: 1.25rem;
            color: var(--text);
            background: var(--primary-light);
            border: 1px solid transparent;
            border-radius: 12px;
            text-decoration: none;
            transition:
                transform 160ms ease,
                box-shadow 160ms ease,
                border-color 160ms ease;
        }

        .page-link:hover {
            transform: translateY(-3px);
            border-color: var(--accent);
            box-shadow: 0 8px 20px rgba(20, 40, 60, 0.12);
        }

        .page-link:focus-visible {
            outline: 4px solid var(--focus);
            outline-offset: 3px;
        }

        .page-name {
            display: block;
            margin-bottom: 0.5rem;
            color: var(--primary);
            font-size: 1.1rem;
            font-weight: 700;
            line-height: 1.3;
        }

        .page-description {
            display: block;
            margin-bottom: 1rem;
            color: var(--muted);
            font-size: 0.95rem;
            line-height: 1.5;
        }

        .file-name {
            display: block;
            margin-top: auto;
            color: var(--muted);
            font-family: Consolas, Monaco, monospace;
            font-size: 0.8rem;
            overflow-wrap: anywhere;
        }

        .status-message {
            margin-bottom: 1rem;
            padding: 1rem;
            background: var(--primary-light);
            border-left: 5px solid var(--accent);
            border-radius: 6px;
        }

        .error-message {
            background: var(--error-background);
            border-left-color: var(--error-border);
        }

        .warning-message {
            background: var(--warning-background);
            border-left-color: var(--warning-border);
        }

        footer {
            padding: 1rem;
            color: var(--muted);
            text-align: center;
            font-size: 0.9rem;
        }

        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                scroll-behavior: auto !important;
                transition: none !important;
            }
        }
    </style>
</head>

<body>
    <header>
        <h1>John's GitHub Resources</h1>

        <p>
            Select a project below. This directory updates automatically
            when HTML pages are added to the repository.
        </p>
    </header>

    <main>
        <section
            class="directory-panel"
            aria-labelledby="directory-heading"
        >
            <h2
                class="directory-heading"
                id="directory-heading"
            >
                Available Pages
            </h2>

            <p class="directory-description">
                Select a page to open the application or resource.
            </p>

            <div
                id="status-message"
                class="status-message"
                role="status"
                aria-live="polite"
            >
                Loading pages...
            </div>

            <ul id="page-list" hidden></ul>
        </section>
    </main>

    <footer>
        Hosted with GitHub Pages
    </footer>

    <script>
        "use strict";

        const githubUsername = "jghazzagh";
        const repositoryName = "applications";

        const pageList =
            document.getElementById("page-list");

        const statusMessage =
            document.getElementById("status-message");

        /*
         * These are used only if GitHub's public API is unavailable.
         *
         * You can add future files here as an emergency fallback,
         * but under normal conditions the API will find them
         * automatically.
         */
        const fallbackFiles = [
            "bsbuilder.html",
            "jcreatorplus.html",
            "promptbuilder.html",
            "widgetbuilder.html"
        ];

        function createReadableTitle(fileName) {
            return fileName
                .replace(/\.html$/i, "")
                .replace(/[-_]+/g, " ")
                .replace(/\b\w/g, function (letter) {
                    return letter.toUpperCase();
                });
        }

        function getPageAddress(fileName) {
            return "./" + encodeURIComponent(fileName);
        }

        function showStatus(message, type) {
            statusMessage.textContent = message;
            statusMessage.className = "status-message";

            if (type === "error") {
                statusMessage.classList.add(
                    "error-message"
                );
            }

            if (type === "warning") {
                statusMessage.classList.add(
                    "warning-message"
                );
            }

            statusMessage.hidden = false;
        }

        async function getPageDetails(fileName) {
            const pageAddress =
                getPageAddress(fileName);

            try {
                const response =
                    await fetch(pageAddress, {
                        cache: "no-store"
                    });

                if (!response.ok) {
                    throw new Error(
                        "Page returned status " +
                        response.status
                    );
                }

                const htmlText =
                    await response.text();

                const parser =
                    new DOMParser();

                const pageDocument =
                    parser.parseFromString(
                        htmlText,
                        "text/html"
                    );

                const titleElement =
                    pageDocument.querySelector("title");

                const descriptionElement =
                    pageDocument.querySelector(
                        'meta[name="description"]'
                    );

                let title =
                    createReadableTitle(fileName);

                let description =
                    "Open this page to view the tool or resource.";

                if (
                    titleElement &&
                    titleElement.textContent.trim()
                ) {
                    title =
                        titleElement.textContent.trim();
                }

                if (descriptionElement) {
                    const descriptionContent =
                        descriptionElement.getAttribute(
                            "content"
                        );

                    if (
                        descriptionContent &&
                        descriptionContent.trim()
                    ) {
                        description =
                            descriptionContent.trim();
                    }
                }

                return {
                    fileName: fileName,
                    address: pageAddress,
                    title: title,
                    description: description
                };
            } catch (error) {
                console.warn(
                    "Could not read metadata from:",
                    fileName,
                    error
                );

                return {
                    fileName: fileName,
                    address: pageAddress,
                    title:
                        createReadableTitle(fileName),
                    description:
                        "Open this page to view the tool or resource."
                };
            }
        }

        function createPageCard(page) {
            const listItem =
                document.createElement("li");

            listItem.className = "page-card";

            const link =
                document.createElement("a");

            link.className = "page-link";
            link.href = page.address;

            const pageName =
                document.createElement("span");

            pageName.className = "page-name";
            pageName.textContent = page.title;

            const pageDescription =
                document.createElement("span");

            pageDescription.className =
                "page-description";

            pageDescription.textContent =
                page.description;

            const fileName =
                document.createElement("span");

            fileName.className = "file-name";
            fileName.textContent = page.fileName;

            link.appendChild(pageName);
            link.appendChild(pageDescription);
            link.appendChild(fileName);

            listItem.appendChild(link);
            pageList.appendChild(listItem);
        }

        async function displayPages(
            fileNames,
            fallbackWasUsed
        ) {
            const uniqueFileNames =
                Array.from(new Set(fileNames))
                    .filter(function (fileName) {
                        return (
                            fileName
                                .toLowerCase()
                                .endsWith(".html") &&
                            fileName.toLowerCase() !==
                                "index.html"
                        );
                    });

            if (uniqueFileNames.length === 0) {
                showStatus(
                    "No additional HTML files were found.",
                    "warning"
                );

                return;
            }

            statusMessage.textContent =
                "Loading page titles and descriptions...";

            const pages =
                await Promise.all(
                    uniqueFileNames.map(
                        getPageDetails
                    )
                );

            pages.sort(function (
                firstPage,
                secondPage
            ) {
                return firstPage.title.localeCompare(
                    secondPage.title
                );
            });

            pageList.innerHTML = "";

            pages.forEach(createPageCard);

            pageList.hidden = false;

            if (fallbackWasUsed) {
                showStatus(
                    "The pages were loaded from the backup list because GitHub's automatic file scan was temporarily unavailable.",
                    "warning"
                );
            } else {
                statusMessage.hidden = true;
            }
        }

        async function loadHtmlPages() {
            /*
             * No branch is included here.
             * GitHub automatically uses the repository's
             * default branch.
             */
            const apiAddress =
                "https://api.github.com/repos/" +
                githubUsername +
                "/" +
                repositoryName +
                "/contents";

            try {
                const response =
                    await fetch(apiAddress, {
                        cache: "no-store"
                    });

                if (!response.ok) {
                    throw new Error(
                        "GitHub API returned status " +
                        response.status
                    );
                }

                const files =
                    await response.json();

                if (!Array.isArray(files)) {
                    throw new Error(
                        "GitHub did not return a file list."
                    );
                }

                const htmlFileNames =
                    files
                        .filter(function (item) {
                            return (
                                item.type === "file" &&
                                item.name
                                    .toLowerCase()
                                    .endsWith(".html") &&
                                item.name
                                    .toLowerCase() !==
                                    "index.html"
                            );
                        })
                        .map(function (item) {
                            return item.name;
                        });

                await displayPages(
                    htmlFileNames,
                    false
                );
            } catch (error) {
                console.error(
                    "Automatic directory scan failed:",
                    error
                );

                /*
                 * The page still works even if GitHub's API
                 * temporarily rejects or limits the request.
                 */
                await displayPages(
                    fallbackFiles,
                    true
                );
            }
        }

        loadHtmlPages();
    </script>
</body>
</html>
